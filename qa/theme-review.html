<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPATIA 디자인 검토</title><style>*{box-sizing:border-box}body{margin:0;background:#F3ECDE;color:#183451;font:13px system-ui}header{padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#183451;color:#F3ECDE;position:sticky;top:0;z-index:10}button,select{padding:9px 12px;font:inherit;cursor:pointer;color:#183451;background:#F3ECDE;border:1px solid #D4AF83}button.active{background:#D4AF83}.viewport{padding:20px;display:flex;justify-content:center;overflow:hidden}#holder{position:relative;background:#183451;box-shadow:0 2px 20px #18345122}iframe{display:block;border:0;transform-origin:top left}pre{padding:18px;margin:0 20px 20px;white-space:pre-wrap;border:1px solid #D4AF83;max-height:230px;overflow:auto;font:12px/1.7 system-ui}</style></head><body><header><b>SPATIA 디자인 검토</b><button data-width="390">모바일 390</button><button data-width="768">태블릿 768</button><button data-width="1440">PC 1440</button><select id="route" aria-label="검토 화면"><option value="index.html">홈·공간 분석</option><option value="gis.html">GIS 입지</option><option value="management.html">역할 체험</option><option value="collaboration.html">공동 관리</option><option value="shared-setup.html">권한 설정</option><option value="guide.html">사용 가이드</option><option value="cloud.html">개인 백업</option></select><button id="check">화면 검사</button><button id="workspace">분석 영역 보기</button><button id="top">첫 화면 보기</button></header><div class="viewport"><div id="holder"><iframe title="SPATIA 검토 화면" id="frame" src="index.html"></iframe></div></div><pre id="report">화면을 불러오는 중…</pre><script>
const frame=document.getElementById('frame'),holder=document.getElementById('holder'),report=document.getElementById('report');let width=390;function size(){const scale=Math.min(1,(innerWidth-40)/width);frame.style.width=width+'px';frame.style.height='1400px';frame.style.transform='scale('+scale+')';holder.style.width=width*scale+'px';holder.style.height=1400*scale+'px';document.querySelectorAll('[data-width]').forEach(b=>b.classList.toggle('active',+b.dataset.width===width))}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=+b.dataset.width;size();report.textContent='크기 변경 완료 · 화면 검사를 실행하세요.'});document.getElementById('route').onchange=e=>{frame.src=e.target.value;report.textContent='화면을 불러오는 중…'};frame.onload=()=>{size();report.textContent='화면 준비 완료 · '+frame.contentWindow.innerWidth+'px'};window.addEventListener('resize',size);document.getElementById('workspace').onclick=()=>frame.contentDocument.getElementById('workspace')?.scrollIntoView({block:'start'});document.getElementById('top').onclick=()=>frame.contentWindow.scrollTo(0,0);
document.getElementById('check').onclick=async()=>{const d=frame.contentDocument,w=frame.contentWindow,checks=[];await new Promise(resolve=>w.requestAnimationFrame(()=>w.requestAnimationFrame(resolve)));const check=(name,pass,value)=>checks.push({name,pass:!!pass,value});check('가로 넘침 없음',d.documentElement.scrollWidth<=w.innerWidth+1,{viewport:w.innerWidth,content:d.documentElement.scrollWidth});check('주요 서비스 6개',d.querySelectorAll('.spatia-workspaces a').length===6);check('현재 서비스 표시',d.querySelectorAll('.spatia-workspaces [aria-current=page]').length===1);check('네이비 상단 메뉴',w.getComputedStyle(d.querySelector('.spatia-site-header')).backgroundColor==='rgb(24, 52, 81)');check('공통 하단 메뉴',!!d.querySelector('.spatia-site-footer'));const siteMenu=d.querySelector('.spatia-site-menu');if(w.innerWidth<=900){siteMenu.click();check('사이트 메뉴 열기',siteMenu.getAttribute('aria-expanded')==='true'&&w.getComputedStyle(d.querySelector('.spatia-workspaces')).display!=='none');d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check('사이트 메뉴 Escape 닫기',siteMenu.getAttribute('aria-expanded')==='false');}const sidebar=d.querySelector('.sidebar,.rail');if(sidebar){const card=d.querySelector('.project,.building-card');if(card){const a=card.getBoundingClientRect();check('건물 카드 안에 텍스트 표시',[...card.children].every(el=>{const b=el.getBoundingClientRect();return b.top>=a.top-1&&b.bottom<=a.bottom+1&&b.left>=a.left-1&&b.right<=a.right+1}));}if(w.innerWidth<=900){d.querySelector('.spatia-menu-toggle').click();const content=d.querySelector('.spatia-analysis-content')||d.querySelector('main');check('분석 도구 열기·배경 비활성화',sidebar.classList.contains('is-open')&&!sidebar.inert&&content.inert&&d.querySelector('.spatia-site-header').inert);d.querySelector('.spatia-drawer-close').click();check('분석 도구 닫기',sidebar.inert&&!content.inert&&!d.querySelector('.spatia-site-header').inert)}}const footer=d.querySelector('.spatia-site-footer');check('푸터 좌우 여백',parseFloat(w.getComputedStyle(footer).paddingLeft)>=24);if(d.body.dataset.page==='geo'){const hero=d.querySelector('.spatia-hero').getBoundingClientRect(),image=d.querySelector('.spatia-hero-building').getBoundingClientRect(),copy=d.querySelector('.spatia-hero-copy').getBoundingClientRect();check('건물 이미지 전체 표시',image.left>=hero.left&&image.right<=hero.right&&image.bottom<=hero.bottom&&image.top>=copy.bottom);const art=d.querySelector('.spatia-hero-building');check('첫 화면 일러스트 표시',art.complete&&art.naturalWidth>0);check('분석 바로가기 연결',!!d.querySelector('a[href="#workspace"]')&&!!d.querySelector('#workspace #analysisContent canvas'));check('분석 캔버스 너비',d.querySelector('#modelCanvas').getBoundingClientRect().width>180)}if(d.body.dataset.page==='guide')check('사용 가이드 1~5 유지',d.querySelectorAll('.guide-section').length===5);if(d.body.dataset.page==='management'){d.querySelector('#roles [data-role=resident]').click();d.querySelector('#mainAction').click();check('요청 팝업·선택 입력 유지',!!d.querySelector('#requestDescription[required]')&&!d.querySelector('#requestTitle').required);d.querySelector('dialog .close').click()}report.textContent=JSON.stringify({route:d.body.dataset.page,width:w.innerWidth,pass:checks.every(c=>c.pass),checks},null,2)};size();
</script></body></html>
