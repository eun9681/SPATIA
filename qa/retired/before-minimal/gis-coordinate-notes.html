<section class="card"><h2>좌표 변환과 정확도</h2><p><code>E = E₀ + s(x cosθ − y sinθ), N = N₀ + s(x sinθ + y cosθ)</code>. 높이는 <code>H = H₀ + sz</code>입니다. 좌표 변환은 proj4로 수행합니다. EPSG:3857은 투영 왜곡이 있으므로 현장 거리 비교에 사용하지 않습니다. 수직 기준면과 측량 잔차는 별도 검증해야 합니다.</p><p class="meta">좌표 기준은 모델 JSON에 함께 저장됩니다. 외부 GeoJSON은 이 페이지 메모리에만 유지됩니다.</p></section>
