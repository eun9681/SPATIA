<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPATIA 모션 검토</title><style>*{box-sizing:border-box}body{margin:0;background:#F7F4EB;color:#174B4C;font:12px system-ui}header{padding:10px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#174B4C;color:#F7F4EB}button{padding:9px 12px;background:#F7F4EB;border:1px solid #E89528;color:#174B4C;cursor:pointer;font:inherit}main{padding:18px;display:flex;justify-content:center}.holder{background:#174B4C;overflow:hidden}iframe{display:block;border:0;transform-origin:top left}pre{white-space:pre-wrap;padding:20px;line-height:1.7;max-height:160px;overflow:auto}</style><header><b>SPATIA 모션·반응형 검토</b><button data-size="390">모바일 390</button><button data-size="768">태블릿 768</button><button data-size="1440">PC 1440</button><button data-progress="0">01 외부</button><button data-progress="0.4">02 회전</button><button data-progress="0.98">03 실내</button><button id="check">화면 검사</button></header><main><div class="holder"><iframe src="index.html" title="검토 화면"></iframe></div></main><pre id="report">화면 준비 중…</pre><script>
const frame=document.querySelector('iframe'),holder=document.querySelector('.holder'),report=document.getElementById('report');let width=1440;
function resize(){const scale=Math.min(1,(innerWidth-36)/width,Math.max(380,innerHeight-160)/820);frame.style.width=width+'px';frame.style.height='820px';frame.style.transform='scale('+scale+')';holder.style.width=width*scale+'px';holder.style.height=820*scale+'px'}
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{width=+b.dataset.size;resize()};window.onresize=resize;frame.onload=()=>{resize();report.textContent='준비 완료'};resize();
for(const b of document.querySelectorAll('[data-progress]'))b.onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument,s=d.querySelector('.spatia-journey'),h=d.querySelector('.spatia-hero'),top=parseFloat(w.getComputedStyle(h).top)||0;w.scrollTo({top:s.offsetTop-top+(s.offsetHeight-h.offsetHeight)*+b.dataset.progress,behavior:'instant'})};
document.getElementById('check').onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument,h=d.querySelector('.spatia-hero'),canvas=d.getElementById('journeyCanvas'),r=h.getBoundingClientRect(),footer=d.querySelector('.spatia-site-footer');const checks=[{name:'가로 넘침 없음',pass:d.documentElement.scrollWidth<=w.innerWidth},{name:'3D 데이터 비동기 로드',pass:h.dataset.scene==='ready'},{name:'캔버스 표시·픽셀 준비',pass:canvas.width>0&&w.getComputedStyle(canvas).display!=='none'},{name:'메인 컬러 적용',pass:w.getComputedStyle(d.querySelector('.spatia-site-header')).backgroundColor==='rgb(23, 75, 76)'},{name:'첫 화면 고정',pass:Math.abs(r.top-top())<2},{name:'푸터 여백 유지',pass:parseFloat(w.getComputedStyle(footer).paddingLeft)>=24}];function top(){return parseFloat(w.getComputedStyle(h).top)||0}report.textContent=JSON.stringify({width:w.innerWidth,phase:h.dataset.motion,progress:h.style.getPropertyValue('--journey-progress'),pass:checks.every(c=>c.pass),checks},null,2)};
</script></html>
