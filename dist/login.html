<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 — SPATIA</title><link rel="preload" href="fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="ui-system.css"><link rel="stylesheet" href="platform.css"><link rel="stylesheet" href="spatia-theme.css"><link rel="stylesheet" href="site-palette.css"><link rel="stylesheet" href="minimal.css"><link rel="stylesheet" href="flat-design.css"><link rel="stylesheet" href="consumer-ux.css"></head><body data-page="login"><main><h1 id="authTitle">로그인</h1><section class="card login-card"><form id="sharedAuth" novalidate><label>이메일<input id="sharedEmail" type="email" autocomplete="username" placeholder="name@example.com" aria-describedby="sharedEmail-error" required><span id="sharedEmail-error" class="ux-field-error" aria-live="polite" hidden></span></label><label>비밀번호<input id="sharedPassword" type="password" autocomplete="current-password" aria-describedby="sharedPassword-error" required><span id="sharedPassword-error" class="ux-field-error" aria-live="polite" hidden></span></label><div class="actions"><button id="sharedLogin" class="primary" disabled>로그인하기</button><button id="sharedRegister" class="primary" type="submit" disabled hidden>계정 만들기</button></div></form><button id="sharedMode" class="auth-mode" type="button" disabled>처음이라면 계정 만들기</button><p id="sharedAccount" class="meta"></p><div id="accountActions" class="auth-account-actions" hidden><a class="button primary" href="management.html">내 워크스페이스 열기</a><button id="sharedLogout" class="secondary" type="button" disabled>로그아웃하기</button></div><p id="sharedStatus" class="status" role="status" aria-live="polite">로그인을 준비하고 있어요.</p></section></main><script src="firebase-config.js"></script><script defer src="login-loader.js"></script><script defer src="ui-shell.js"></script><script defer src="spa-router.js"></script><script defer src="ux-patterns.js"></script></body></html>
